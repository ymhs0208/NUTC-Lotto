  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <title>國立臺中科技大學 NTCUST 資訊與流通學院 專題成果展</title>
    <meta name="description" content="國立臺中科技大學 NTCUST 資訊與流通學院 專題成果展報告抽籤系統。支援學生組長查榜、台上大螢幕獨立分組抽籤、名冊管理及抽籤結果即時匯出。" />
    <meta property="og:title" content="國立臺中科技大學 NTCUST 資訊與流通學院 專題成果展" />
    <meta property="og:description" content="國立臺中科技大學 NTCUST 資訊與流通學院 專題成果展報告抽籤系統。支援學生組長查榜、台上大螢幕獨立分組抽籤、名冊管理及抽籤結果即時匯出。" />
    <meta property="og:image" content="https://nutc.cc.cd/android-chrome-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nutc.cc.cd/android-chrome-512x512.png" />
  </head>
  <body>
    <div id="page-boot-fallback" role="status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,sans-serif;color:#172b45;padding:20px;box-sizing:border-box">
      <div style="max-width:460px;width:100%;text-align:center;border:1px solid #d9e3ed;border-radius:20px;background:white;padding:28px;box-sizing:border-box">
        <h1 id="page-boot-title" style="font-size:22px;margin:0 0 12px">正在載入網站</h1>
        <p id="page-boot-message" style="margin:0;font-size:14px;line-height:1.7;color:#52657a">正在準備頁面，請稍候。</p>
        <button id="page-boot-reload" type="button" style="display:none;margin-top:24px;border:0;border-radius:10px;background:#28518a;color:white;padding:12px 20px;font-size:14px;cursor:pointer">重新載入頁面</button>
        <noscript>請啟用瀏覽器 JavaScript，才能使用本網站。</noscript>
      </div>
    </div>
    <script>
      (function () {
        var active = true;
        var timer;
        var reload = document.getElementById('page-boot-reload');
        reload.addEventListener('click', function () { location.reload(); });
        function showFailure() {
          if (!active) return;
          var offline = navigator.onLine === false;
          document.getElementById('page-boot-fallback').setAttribute('role', 'alert');
          document.getElementById('page-boot-title').textContent = offline ? '目前沒有網路連線' : '網站載入未完成';
          document.getElementById('page-boot-message').textContent = offline ? '請確認 Wi-Fi 或行動網路，恢復連線後再重新載入。' : '可能是網站更新版本、連線中斷或載入較慢。請重新載入取得最新頁面；若問題持續，請聯絡大會工作人員。';
          reload.style.display = 'inline-block';
        }
        function ready() {
          active = false;
          clearTimeout(timer);
          window.removeEventListener('error', showFailure, true);
          window.removeEventListener('unhandledrejection', showFailure);
          window.removeEventListener('offline', showFailure);
          window.removeEventListener('page-app-ready', ready);
        }
        window.addEventListener('error', showFailure, true);
        window.addEventListener('unhandledrejection', showFailure);
        window.addEventListener('offline', showFailure);
        window.addEventListener('page-app-ready', ready);
        timer = setTimeout(showFailure, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
